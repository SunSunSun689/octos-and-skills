[package]
name = "robot-api"
version = "2.0.0"
edition = "2021"
description = "Send natural-language robot commands directly to the car via HTTP"
authors = ["octos"]

[[bin]]
name = "robot_api"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }

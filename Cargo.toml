[package]
name = "robot-multi"
version = "0.1.0"
edition = "2021"
description = "Control multiple AKA-00 robots simultaneously via natural language"
authors = ["octos"]

[[bin]]
name = "robot_multi"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tungstenite = "0.24"
native-tls = "0.2"

[workspace]
